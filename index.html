<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Vinilo — tu reproductor</title>
<meta name="description" content="Tu reproductor personal. Tus canciones, guardadas solo en tu dispositivo.">
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#16140f">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #16140f;
    --surface: #201d16;
    --surface-2: #2a261c;
    --cream: #f2ede1;
    --amber: #e8a33d;
    --teal: #3f6659;
    --rust: #c1443c;
    --muted: #8a8477;
    --font-display: 'Big Shoulders Display', sans-serif;
    --font-body: 'Inter', -apple-system, sans-serif;
    --font-mono: 'Space Mono', monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--bg);
    color: var(--cream);
    font-family: var(--font-body);
    min-height: 100vh;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    display: flex;
    flex-direction: column;
    padding-bottom: 2rem;
  }

  /* subtle grain texture */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0.035;
    background-image: radial-gradient(circle, #fff 1px, transparent 1px);
    background-size: 3px 3px;
    z-index: 0;
  }

  header {
    padding: 1.5rem 1.5rem 0.5rem;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    position: relative;
    z-index: 1;
  }

  header .brand {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 1.6rem;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--cream);
  }

  header .brand span { color: var(--amber); }

  header .count {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    color: var(--muted);
  }

  /* ---------- PLAYER HERO ---------- */
  .player {
    position: relative;
    z-index: 1;
    padding: 1rem 1.5rem 1.5rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.25rem;
  }

  .turntable {
    position: relative;
    width: min(58vw, 240px);
    height: min(58vw, 240px);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .ambient-glow {
    position: absolute;
    inset: -30%;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(232,163,61,0.35) 0%, rgba(193,68,60,0.12) 45%, transparent 70%);
    filter: blur(18px);
    opacity: 0;
    transform: scale(0.85);
    transition: opacity 0.6s ease, transform 0.6s ease;
    pointer-events: none;
    z-index: -1;
  }

  .ambient-glow.playing {
    opacity: 1;
    animation: pulse-glow 3.5s ease-in-out infinite;
  }

  @keyframes pulse-glow {
    0%, 100% { transform: scale(0.9); }
    50% { transform: scale(1.08); }
  }

  .disc {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background:
      repeating-radial-gradient(circle at center,
        #0d0c09 0px, #0d0c09 2px,
        #17140f 2px, #17140f 4px);
    box-shadow:
      0 12px 30px rgba(0,0,0,0.55),
      inset 0 0 0 1px rgba(255,255,255,0.04);
    display: flex;
    align-items: center;
    justify-content: center;
    animation: spin 6s linear infinite;
    animation-play-state: paused;
    transition: box-shadow 0.3s;
  }

  .disc.playing { animation-play-state: running; }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .disc .label {
    width: 36%;
    height: 36%;
    border-radius: 50%;
    background: var(--amber);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 1.1rem;
    color: var(--bg);
    text-align: center;
    line-height: 1;
    box-shadow: inset 0 0 0 6px rgba(22,20,15,0.15);
    overflow: hidden;
  }

  .disc .hole {
    position: absolute;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--bg);
  }

  .tonearm {
    position: absolute;
    top: -8%;
    right: -6%;
    width: 40%;
    height: 40%;
    transform-origin: 90% 10%;
    transform: rotate(-18deg);
    transition: transform 0.4s ease;
    pointer-events: none;
  }

  .tonearm.playing { transform: rotate(4deg); }

  .tonearm::before {
    content: "";
    position: absolute;
    top: 8%;
    right: 8%;
    width: 6px;
    height: 78%;
    background: linear-gradient(var(--muted), var(--surface-2));
    border-radius: 3px;
    transform: rotate(28deg);
    transform-origin: top center;
  }

  .tonearm::after {
    content: "";
    position: absolute;
    top: 4%;
    right: 4%;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--surface-2);
    box-shadow: 0 0 0 3px var(--bg);
  }

  .now-playing {
    text-align: center;
    max-width: 90vw;
  }

  .now-playing .title {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 1.4rem;
    letter-spacing: 0.01em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .now-playing .subtitle {
    font-family: var(--font-mono);
    font-size: 0.75rem;
    color: var(--muted);
    margin-top: 0.15rem;
  }

  .seek-row {
    width: 100%;
    max-width: 420px;
    display: flex;
    align-items: center;
    gap: 0.6rem;
    font-family: var(--font-mono);
    font-size: 0.7rem;
    color: var(--muted);
  }

  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    flex: 1;
    height: 4px;
    border-radius: 2px;
    background: var(--surface-2);
    outline: none;
  }

  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--amber);
    cursor: pointer;
    box-shadow: 0 0 0 4px rgba(232,163,61,0.15);
  }

  input[type="range"]::-moz-range-thumb {
    width: 14px;
    height: 14px;
    border: none;
    border-radius: 50%;
    background: var(--amber);
    cursor: pointer;
  }

  #seek { flex: 1; }
  #seek::-webkit-slider-runnable-track { background: var(--surface-2); border-radius: 2px; }

  .controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 1.1rem;
  }

  .ctrl-btn {
    background: none;
    border: none;
    color: var(--cream);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0.4rem;
  }

  .ctrl-btn svg { width: 22px; height: 22px; }

  .mode-btn {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0.4rem;
    position: relative;
  }

  .mode-btn svg { width: 18px; height: 18px; }

  .mode-btn.active { color: var(--amber); }

  .mode-btn.active::after {
    content: "";
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--amber);
  }

  .mode-btn .repeat-one-badge {
    position: absolute;
    top: -2px;
    right: -2px;
    font-family: var(--font-mono);
    font-size: 0.55rem;
    background: var(--amber);
    color: var(--bg);
    border-radius: 50%;
    width: 12px;
    height: 12px;
    display: none;
    align-items: center;
    justify-content: center;
    line-height: 1;
  }

  .mode-btn.repeat-one .repeat-one-badge { display: flex; }

  .play-btn {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: var(--amber);
    color: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 6px 18px rgba(232,163,61,0.28);
    transition: transform 0.15s ease;
  }

  .play-btn:active { transform: scale(0.94); }
  .play-btn svg { width: 26px; height: 26px; }

  .volume-row {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    width: 100%;
    max-width: 200px;
    color: var(--muted);
  }

  .volume-row svg { width: 16px; height: 16px; flex-shrink: 0; }

  /* ---------- LIBRARY ---------- */
  .library {
    position: relative;
    z-index: 1;
    padding: 0.5rem 1.5rem 2rem;
  }

  .library-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 0.8rem;
    gap: 0.6rem;
  }

  .library h2 {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 1rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .sort-select {
    background: var(--surface);
    color: var(--muted);
    border: none;
    border-radius: 8px;
    padding: 0.35rem 0.5rem;
    font-family: var(--font-mono);
    font-size: 0.65rem;
    outline: none;
  }

  .search-row {
    position: relative;
    margin-bottom: 1rem;
  }

  .search-row svg {
    position: absolute;
    left: 0.8rem;
    top: 50%;
    transform: translateY(-50%);
    width: 15px;
    height: 15px;
    color: var(--muted);
    pointer-events: none;
  }

  #search-input {
    width: 100%;
    background: var(--surface);
    border: none;
    border-radius: 12px;
    padding: 0.65rem 0.9rem 0.65rem 2.3rem;
    color: var(--cream);
    font-family: var(--font-body);
    font-size: 0.85rem;
    outline: none;
  }

  #search-input::placeholder { color: var(--muted); }
  #search-input:focus { box-shadow: 0 0 0 2px var(--amber); }

  .drop-zone {
    border: 2px dashed var(--surface-2);
    border-radius: 14px;
    padding: 1.5rem 1rem;
    text-align: center;
    color: var(--muted);
    font-size: 0.85rem;
    margin-bottom: 1.2rem;
    cursor: pointer;
    transition: border-color 0.2s, color 0.2s, background 0.2s;
  }

  .drop-zone:hover, .drop-zone.drag-over {
    border-color: var(--amber);
    color: var(--amber);
    background: rgba(232,163,61,0.05);
  }

  .drop-zone strong {
    display: block;
    font-family: var(--font-display);
    font-size: 1.1rem;
    color: var(--cream);
    font-weight: 700;
    margin-bottom: 0.2rem;
    letter-spacing: 0.02em;
  }

  .drop-zone.drag-over strong { color: var(--amber); }

  #file-input { display: none; }

  .empty-state {
    text-align: center;
    color: var(--muted);
    font-size: 0.85rem;
    padding: 2rem 1rem;
  }

  .track-list { display: flex; flex-direction: column; gap: 0.4rem; }

  .track {
    display: flex;
    align-items: center;
    gap: 0.8rem;
    background: var(--surface);
    border-radius: 12px;
    padding: 0.7rem 0.8rem;
    cursor: pointer;
    transition: background 0.15s;
  }

  .track:hover { background: var(--surface-2); }

  .track.active {
    background: var(--surface-2);
    box-shadow: inset 3px 0 0 var(--amber);
  }

  .track-num {
    font-family: var(--font-mono);
    font-size: 0.75rem;
    color: var(--muted);
    width: 1.4rem;
    text-align: center;
    flex-shrink: 0;
  }

  .track.active .track-num { color: var(--amber); }

  .eq {
    display: flex;
    align-items: flex-end;
    gap: 2px;
    width: 1.4rem;
    height: 14px;
  }

  .eq span {
    width: 3px;
    background: var(--amber);
    border-radius: 1px;
    animation: eq 1s ease-in-out infinite;
  }
  .eq span:nth-child(1) { height: 40%; animation-delay: -0.6s; }
  .eq span:nth-child(2) { height: 100%; animation-delay: -0.2s; }
  .eq span:nth-child(3) { height: 65%; animation-delay: -0.9s; }

  @keyframes eq {
    0%, 100% { transform: scaleY(0.4); }
    50% { transform: scaleY(1); }
  }

  .track-info {
    flex: 1;
    min-width: 0;
  }

  .track-title {
    font-size: 0.9rem;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .track-meta {
    font-family: var(--font-mono);
    font-size: 0.68rem;
    color: var(--muted);
    margin-top: 0.1rem;
  }

  .track-actions {
    display: flex;
    gap: 0.3rem;
    flex-shrink: 0;
  }

  .icon-btn {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    padding: 0.35rem;
    display: flex;
    border-radius: 8px;
  }

  .icon-btn:hover { color: var(--cream); background: rgba(255,255,255,0.06); }
  .icon-btn svg { width: 16px; height: 16px; }

  audio { display: none; }

  @media (prefers-reduced-motion: reduce) {
    .disc, .eq span { animation: none !important; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">Vini<span>lo</span></div>
  <div class="count" id="track-count">0 canciones</div>
</header>

<section class="player">
  <div class="turntable">
    <div class="ambient-glow" id="ambient-glow"></div>
    <div class="disc" id="disc">
      <div class="label" id="disc-label">♪</div>
    </div>
    <div class="tonearm" id="tonearm"></div>
  </div>

  <div class="now-playing">
    <div class="title" id="now-title">Sin canción</div>
    <div class="subtitle" id="now-subtitle">Sube música para empezar</div>
  </div>

  <div class="seek-row">
    <span id="time-current">0:00</span>
    <input type="range" id="seek" min="0" max="100" value="0" step="0.1">
    <span id="time-total">0:00</span>
  </div>

  <div class="controls">
    <button class="mode-btn" id="shuffle-btn" aria-label="Aleatorio">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04z"/></svg>
    </button>
    <button class="ctrl-btn" id="prev-btn" aria-label="Anterior">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
    </button>
    <button class="play-btn" id="play-btn" aria-label="Reproducir">
      <svg id="play-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
    </button>
    <button class="ctrl-btn" id="next-btn" aria-label="Siguiente">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 6l8.5 6L6 18z"/></svg>
    </button>
    <button class="mode-btn" id="repeat-btn" aria-label="Repetir">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 7h10v3l4-4-4-4v3H5v6h2zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2z"/></svg>
      <span class="repeat-one-badge">1</span>
    </button>
  </div>

  <div class="volume-row">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 10v4h4l5 5V5L7 10H3zm13.5 2A4.5 4.5 0 0 0 15 8.3v7.4a4.5 4.5 0 0 0 1.5-3.7z"/></svg>
    <input type="range" id="volume" min="0" max="1" step="0.01" value="1">
  </div>

  <audio id="audio"></audio>
</section>

<section class="library">
  <div class="library-head">
    <h2>Tu colección</h2>
    <select class="sort-select" id="sort-select">
      <option value="recent">Más reciente</option>
      <option value="az">A–Z</option>
    </select>
  </div>

  <div class="search-row">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
    <input type="text" id="search-input" placeholder="Buscar en tu colección...">
  </div>

  <div class="drop-zone" id="drop-zone">
    <strong>Insertar canciones</strong>
    Toca aquí o arrastra tus archivos (mp3, m4a, wav)
  </div>
  <input type="file" id="file-input" accept="audio/*" multiple>

  <div id="library-content">
    <div class="empty-state" id="empty-state">Tu colección está vacía. Sube tu primera canción arriba.</div>
    <div class="track-list" id="track-list"></div>
  </div>
</section>

<script>
// ---------- IndexedDB ----------
const DB_NAME = 'vinilo-db';
const STORE = 'tracks';
let db;

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => {
      const database = req.result;
      if (!database.objectStoreNames.contains(STORE)) {
        database.createObjectStore(STORE, { keyPath: 'id', autoIncrement: true });
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function addTrack(track) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readwrite');
    const req = tx.objectStore(STORE).add(track);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function updateTrack(track) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readwrite');
    const req = tx.objectStore(STORE).put(track);
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  });
}

function deleteTrackDB(id) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readwrite');
    const req = tx.objectStore(STORE).delete(id);
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  });
}

function getAllTracks() {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readonly');
    const req = tx.objectStore(STORE).getAll();
    req.onsuccess = () => resolve(req.result.sort((a,b) => a.addedAt - b.addedAt));
    req.onerror = () => reject(req.error);
  });
}

// ---------- State ----------
let tracks = [];
let currentIndex = -1;
let currentURL = null;
let isPlaying = false;
let shuffleOn = false;
let repeatMode = 'off'; // 'off' | 'all' | 'one'
let searchQuery = '';
let sortMode = 'recent'; // 'recent' | 'az'

// ---------- DOM ----------
const audio = document.getElementById('audio');
const disc = document.getElementById('disc');
const tonearm = document.getElementById('tonearm');
const discLabel = document.getElementById('disc-label');
const nowTitle = document.getElementById('now-title');
const nowSubtitle = document.getElementById('now-subtitle');
const seek = document.getElementById('seek');
const timeCurrent = document.getElementById('time-current');
const timeTotal = document.getElementById('time-total');
const playBtn = document.getElementById('play-btn');
const playIcon = document.getElementById('play-icon');
const prevBtn = document.getElementById('prev-btn');
const nextBtn = document.getElementById('next-btn');
const volume = document.getElementById('volume');
const dropZone = document.getElementById('drop-zone');
const fileInput = document.getElementById('file-input');
const trackList = document.getElementById('track-list');
const emptyState = document.getElementById('empty-state');
const trackCount = document.getElementById('track-count');
const ambientGlow = document.getElementById('ambient-glow');
const shuffleBtn = document.getElementById('shuffle-btn');
const repeatBtn = document.getElementById('repeat-btn');
const searchInput = document.getElementById('search-input');
const sortSelect = document.getElementById('sort-select');

const ICON_PLAY = '<path d="M8 5v14l11-7z"/>';
const ICON_PAUSE = '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>';

function fmtTime(s) {
  if (!isFinite(s) || s < 0) return '0:00';
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60).toString().padStart(2, '0');
  return `${m}:${sec}`;
}

function niceName(filename) {
  return filename.replace(/\.[^/.]+$/, '').replace(/[_-]+/g, ' ').trim();
}

function initials(name) {
  const words = name.split(' ').filter(Boolean);
  if (words.length === 0) return '♪';
  if (words.length === 1) return words[0].slice(0, 2).toUpperCase();
  return (words[0][0] + words[1][0]).toUpperCase();
}

// ---------- Rendering ----------
function currentTrackId() {
  return currentIndex !== -1 && tracks[currentIndex] ? tracks[currentIndex].id : null;
}

function getVisibleTracks() {
  let list = tracks;
  if (searchQuery.trim()) {
    const q = searchQuery.trim().toLowerCase();
    list = list.filter(t => t.title.toLowerCase().includes(q));
  }
  list = list.slice();
  if (sortMode === 'az') {
    list.sort((a, b) => a.title.localeCompare(b.title));
  } else {
    list.sort((a, b) => a.addedAt - b.addedAt);
  }
  return list;
}

function renderLibrary() {
  trackCount.textContent = `${tracks.length} canción${tracks.length === 1 ? '' : 'es'}`;
  emptyState.style.display = tracks.length === 0 ? 'block' : 'none';
  trackList.innerHTML = '';

  const visible = getVisibleTracks();
  const activeId = currentTrackId();

  if (tracks.length > 0 && visible.length === 0) {
    const row = document.createElement('div');
    row.className = 'empty-state';
    row.textContent = 'Sin resultados para tu búsqueda.';
    trackList.appendChild(row);
    return;
  }

  visible.forEach((t, i) => {
    const isActive = t.id === activeId;
    const row = document.createElement('div');
    row.className = 'track' + (isActive ? ' active' : '');
    row.innerHTML = `
      <div class="track-num">${isActive && isPlaying
        ? '<div class="eq"><span></span><span></span><span></span></div>'
        : (i + 1)}</div>
      <div class="track-info">
        <div class="track-title">${escapeHTML(t.title)}</div>
        <div class="track-meta">${t.durationLabel || '--:--'}</div>
      </div>
      <div class="track-actions">
        <button class="icon-btn" data-action="rename" data-id="${t.id}" aria-label="Renombrar">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75zM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75z"/></svg>
        </button>
        <button class="icon-btn" data-action="delete" data-id="${t.id}" aria-label="Eliminar">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 19a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V7H6zM19 4h-3.5l-1-1h-5l-1 1H5v2h14z"/></svg>
        </button>
      </div>
    `;
    row.addEventListener('click', (e) => {
      if (e.target.closest('[data-action]')) return;
      playTrackById(t.id);
    });
    trackList.appendChild(row);
  });

  trackList.querySelectorAll('[data-action="delete"]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      removeTrack(Number(btn.dataset.id));
    });
  });
  trackList.querySelectorAll('[data-action="rename"]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      renameTrack(Number(btn.dataset.id));
    });
  });
}

function escapeHTML(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ---------- Playback ----------
function playTrackAt(i) {
  if (i < 0 || i >= tracks.length) return;
  currentIndex = i;
  const t = tracks[i];

  if (currentURL) URL.revokeObjectURL(currentURL);
  currentURL = URL.createObjectURL(t.blob);
  audio.src = currentURL;
  audio.play().catch(() => {});

  nowTitle.textContent = t.title;
  nowSubtitle.textContent = 'Reproduciendo';
  discLabel.textContent = initials(t.title);
  updateMediaSessionMetadata(t);
  renderLibrary();
}

function playTrackById(id) {
  const idx = tracks.findIndex(t => t.id === id);
  if (idx !== -1) playTrackAt(idx);
}

function togglePlay() {
  if (currentIndex === -1) {
    if (tracks.length > 0) playTrackAt(0);
    return;
  }
  if (audio.paused) {
    audio.play().catch(() => {});
  } else {
    audio.pause();
  }
}

function randomIndexExcluding(exclude) {
  if (tracks.length <= 1) return exclude;
  let idx;
  do { idx = Math.floor(Math.random() * tracks.length); } while (idx === exclude);
  return idx;
}

function playNext() {
  if (tracks.length === 0) return;
  if (shuffleOn) {
    playTrackAt(randomIndexExcluding(currentIndex));
  } else {
    playTrackAt((currentIndex + 1) % tracks.length);
  }
}

function playPrev() {
  if (tracks.length === 0) return;
  if (shuffleOn) {
    playTrackAt(randomIndexExcluding(currentIndex));
  } else {
    playTrackAt((currentIndex - 1 + tracks.length) % tracks.length);
  }
}

function handleTrackEnded() {
  if (repeatMode === 'one') {
    audio.currentTime = 0;
    audio.play().catch(() => {});
    return;
  }
  if (!shuffleOn && repeatMode === 'off' && currentIndex === tracks.length - 1) {
    audio.pause();
    audio.currentTime = 0;
    return;
  }
  playNext();
}

// ---------- Shuffle / Repeat controls ----------
shuffleBtn.addEventListener('click', () => {
  shuffleOn = !shuffleOn;
  shuffleBtn.classList.toggle('active', shuffleOn);
});

repeatBtn.addEventListener('click', () => {
  repeatMode = repeatMode === 'off' ? 'all' : repeatMode === 'all' ? 'one' : 'off';
  repeatBtn.classList.toggle('active', repeatMode !== 'off');
  repeatBtn.classList.toggle('repeat-one', repeatMode === 'one');
});

// ---------- Search / Sort ----------
searchInput.addEventListener('input', () => {
  searchQuery = searchInput.value;
  renderLibrary();
});

sortSelect.addEventListener('change', () => {
  sortMode = sortSelect.value;
  renderLibrary();
});

// ---------- Media Session (lock screen / bluetooth controls) ----------
function updateMediaSessionMetadata(t) {
  if (!('mediaSession' in navigator)) return;
  navigator.mediaSession.metadata = new MediaMetadata({
    title: t.title,
    artist: 'Vinilo',
    album: 'Tu colección',
    artwork: [
      { src: './icon-192.png', sizes: '192x192', type: 'image/png' },
      { src: './icon-512.png', sizes: '512x512', type: 'image/png' }
    ]
  });
}

function updatePositionState() {
  if (!('mediaSession' in navigator) || !('setPositionState' in navigator.mediaSession)) return;
  if (!audio.duration || !isFinite(audio.duration)) return;
  try {
    navigator.mediaSession.setPositionState({
      duration: audio.duration,
      playbackRate: audio.playbackRate,
      position: audio.currentTime
    });
  } catch (e) { /* some browsers throw on invalid state, safe to ignore */ }
}

if ('mediaSession' in navigator) {
  navigator.mediaSession.setActionHandler('play', () => audio.play().catch(() => {}));
  navigator.mediaSession.setActionHandler('pause', () => audio.pause());
  navigator.mediaSession.setActionHandler('previoustrack', () => playPrev());
  navigator.mediaSession.setActionHandler('nexttrack', () => playNext());
  navigator.mediaSession.setActionHandler('seekbackward', (details) => {
    audio.currentTime = Math.max(audio.currentTime - (details.seekOffset || 10), 0);
  });
  navigator.mediaSession.setActionHandler('seekforward', (details) => {
    audio.currentTime = Math.min(audio.currentTime + (details.seekOffset || 10), audio.duration || audio.currentTime);
  });
  try {
    navigator.mediaSession.setActionHandler('seekto', (details) => {
      if (details.seekTime !== undefined) audio.currentTime = details.seekTime;
    });
  } catch (e) { /* seekto not supported everywhere */ }
}

audio.addEventListener('play', () => {
  isPlaying = true;
  disc.classList.add('playing');
  tonearm.classList.add('playing');
  ambientGlow.classList.add('playing');
  playIcon.outerHTML = `<svg id="play-icon" viewBox="0 0 24 24" fill="currentColor">${ICON_PAUSE}</svg>`;
  Object.assign(window, { playIcon: document.getElementById('play-icon') });
  nowSubtitle.textContent = 'Reproduciendo';
  if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'playing';
  renderLibrary();
});

audio.addEventListener('pause', () => {
  isPlaying = false;
  disc.classList.remove('playing');
  tonearm.classList.remove('playing');
  ambientGlow.classList.remove('playing');
  const el = document.getElementById('play-icon');
  if (el) el.outerHTML = `<svg id="play-icon" viewBox="0 0 24 24" fill="currentColor">${ICON_PLAY}</svg>`;
  if (currentIndex !== -1) nowSubtitle.textContent = 'En pausa';
  if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'paused';
  renderLibrary();
});

audio.addEventListener('ended', handleTrackEnded);

audio.addEventListener('timeupdate', () => {
  if (!audio.duration) return;
  seek.value = (audio.currentTime / audio.duration) * 100;
  timeCurrent.textContent = fmtTime(audio.currentTime);
  updatePositionState();
});

audio.addEventListener('loadedmetadata', () => {
  timeTotal.textContent = fmtTime(audio.duration);
  if (currentIndex !== -1 && !tracks[currentIndex].durationLabel) {
    tracks[currentIndex].durationLabel = fmtTime(audio.duration);
    updateTrack(tracks[currentIndex]);
    renderLibrary();
  }
  updatePositionState();
});

seek.addEventListener('input', () => {
  if (audio.duration) {
    audio.currentTime = (seek.value / 100) * audio.duration;
  }
});

volume.addEventListener('input', () => {
  audio.volume = volume.value;
});

playBtn.addEventListener('click', togglePlay);
nextBtn.addEventListener('click', playNext);
prevBtn.addEventListener('click', playPrev);

// ---------- Library management ----------
async function removeTrack(id) {
  const idx = tracks.findIndex(t => t.id === id);
  if (idx === -1) return;
  if (idx === currentIndex) {
    audio.pause();
    audio.removeAttribute('src');
    currentIndex = -1;
    nowTitle.textContent = 'Sin canción';
    nowSubtitle.textContent = 'Sube música para empezar';
    discLabel.textContent = '♪';
  } else if (idx < currentIndex) {
    currentIndex -= 1;
  }
  await deleteTrackDB(id);
  tracks.splice(idx, 1);
  renderLibrary();
}

function renameTrack(id) {
  const t = tracks.find(t => t.id === id);
  if (!t) return;
  const newTitle = prompt('Nuevo nombre para la canción:', t.title);
  if (newTitle && newTitle.trim()) {
    t.title = newTitle.trim();
    updateTrack(t);
    if (tracks[currentIndex] && tracks[currentIndex].id === id) {
      nowTitle.textContent = t.title;
      discLabel.textContent = initials(t.title);
    }
    renderLibrary();
  }
}

async function handleFiles(fileList) {
  const files = Array.from(fileList).filter(f => f.type.startsWith('audio/') || /\.(mp3|m4a|wav|ogg|aac|flac)$/i.test(f.name));
  for (const file of files) {
    const track = {
      title: niceName(file.name),
      blob: file,
      addedAt: Date.now(),
      durationLabel: null
    };
    const id = await addTrack(track);
    track.id = id;
    tracks.push(track);
  }
  renderLibrary();
}

dropZone.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', (e) => {
  handleFiles(e.target.files);
  fileInput.value = '';
});

['dragenter', 'dragover'].forEach(evt => {
  dropZone.addEventListener(evt, (e) => {
    e.preventDefault();
    dropZone.classList.add('drag-over');
  });
});
['dragleave', 'drop'].forEach(evt => {
  dropZone.addEventListener(evt, (e) => {
    e.preventDefault();
    dropZone.classList.remove('drag-over');
  });
});
dropZone.addEventListener('drop', (e) => {
  if (e.dataTransfer.files.length) handleFiles(e.dataTransfer.files);
});

// ---------- Init ----------
(async function init() {
  db = await openDB();
  tracks = await getAllTracks();
  renderLibrary();

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  }
})();
</script>
</body>
</html>
